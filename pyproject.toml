[project]
name = "dotfiles"
dynamic = ["version"]
dependencies = [
  # Tools
  "PyYAML",
  "toml",
]

[tool.setuptools]
packages = []

[tool.ruff]
indent-width = 2

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64"]

[tool.pixi.dependencies]
pre-commit = "*"
# Lsps
ruff = "*"
basedpyright = "*"
vim-language-server = "*"
bash-language-server = "*"
vtsls = "*"
# Formatters
stylua = "*"
go-shfmt = "*"
prettierd = "*"
taplo = "*"

